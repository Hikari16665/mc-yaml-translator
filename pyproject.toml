[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-yaml-translator"
version = "0.1.1"
description = "Translate Minecraft plugin YAML language/config files with a model failover chain."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "NUOYUAN" }]
dependencies = [
  "openai>=1.40",
  "pydantic>=2.7",
  "ruamel.yaml>=0.18",
  "tqdm>=4.66",
  "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
mc-yaml-translator = "mc_yaml_translator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mc_yaml_translator = ["config.toml.example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
