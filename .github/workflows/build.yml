name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build one-file console exe
        run: >
          python -m PyInstaller
          --noconfirm --clean --onefile --console
          --name mc-yaml-translator
          --paths src
          --collect-all ruamel.yaml
          --collect-all tqdm
          --hidden-import colorama
          --hidden-import httpx
          --hidden-import anyio
          --hidden-import httpcore
          --hidden-import certifi
          --hidden-import mc_yaml_translator
          src/mc_yaml_translator/__main__.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc-yaml-translator-windows
          path: |
            dist/mc-yaml-translator.exe
            config.toml.example
            README.md
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mc-yaml-translator.exe
            config.toml.example
          generate_release_notes: true
          fail_on_unmatched_files: true
